<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테트리스</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #1d2b50 0%, transparent 55%),
        #0b1020;
    }

    button { font: inherit; }

    .game {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 20px;
      align-items: start;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #111827;
      box-shadow: 0 24px 70px #0008;
    }

    #board {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 2;
    }

    .side {
      display: grid;
      gap: 14px;
    }

    .panel {
      padding: 16px;
      border: 1px solid #263449;
      border-radius: 14px;
      background: #111a2b;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.65rem;
      letter-spacing: .04em;
    }

    h2 {
      margin: 0 0 10px;
      color: #a5b4fc;
      font-size: .82rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      padding: 10px;
      border-radius: 9px;
      background: #0b1220;
    }

    .stat span {
      display: block;
      color: #94a3b8;
      font-size: .72rem;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
    }

    #next {
      display: block;
      width: 100%;
      height: 128px;
      border-radius: 8px;
      background: #0b1220;
    }

    .actions { display: grid; gap: 8px; }

    .actions button, .mobile-controls button {
      min-height: 42px;
      border: 1px solid #475569;
      border-radius: 9px;
      color: #f8fafc;
      background: #1e293b;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .actions button:hover, .mobile-controls button:hover {
      background: #334155;
    }

    .actions button:active, .mobile-controls button:active {
      transform: translateY(1px);
    }

    .actions .primary {
      border-color: #6366f1;
      background: #4f46e5;
    }

    .help {
      color: #cbd5e1;
      font-size: .78rem;
      line-height: 1.8;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #f8fafc;
      background: #1e293b;
      font: inherit;
      white-space: nowrap;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080d18cc;
      text-align: center;
    }

    .overlay[hidden] { display: none; }
    .overlay strong { display: block; font-size: 1.8rem; }
    .overlay span { display: block; margin-top: 8px; color: #cbd5e1; }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .mobile-controls button { min-width: 0; font-size: 1rem; }

    @media (max-width: 620px) {
      body { padding: 12px; }
      .game { grid-template-columns: minmax(0, 1fr) 118px; gap: 10px; }
      .side { gap: 9px; }
      .panel { padding: 10px; border-radius: 10px; }
      h1 { font-size: 1.2rem; }
      h2 { font-size: .68rem; }
      .stats { grid-template-columns: 1fr; gap: 6px; }
      .stat { padding: 7px; }
      .stat strong { font-size: 1rem; }
      #next { height: 90px; }
      .help { font-size: .68rem; line-height: 1.65; }
      .actions button { min-height: 38px; font-size: .8rem; }
      .mobile-controls { grid-column: 1 / -1; display: grid; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="테트리스 게임">
    <section class="board-wrap" aria-label="게임 보드">
      <canvas id="board" width="300" height="600" aria-label="테트리스 보드"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div>
          <strong id="overlay-title">일시정지</strong>
          <span id="overlay-message">계속하려면 P 키를 누르세요.</span>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <h1>테트리스</h1>
        <div class="stats">
          <div class="stat"><span>점수</span><strong id="score">0</strong></div>
          <div class="stat"><span>최고 점수</span><strong id="best">0</strong></div>
          <div class="stat"><span>레벨</span><strong id="level">1</strong></div>
          <div class="stat"><span>줄</span><strong id="lines">0</strong></div>
        </div>
      </section>

      <section class="panel">
        <h2>다음 블럭</h2>
        <canvas id="next" width="150" height="128" aria-label="다음 블럭"></canvas>
      </section>

      <section class="panel actions">
        <button class="primary" id="start-button" type="button">새 게임</button>
        <button id="pause-button" type="button">일시정지</button>
      </section>

      <section class="panel help">
        <h2>조작 방법</h2>
        <div><kbd>←</kbd> <kbd>→</kbd> 이동</div>
        <div><kbd>↓</kbd> 빠르게 내리기</div>
        <div><kbd>↑</kbd> 회전</div>
        <div><kbd>Space</kbd> 즉시 내리기</div>
        <div><kbd>P</kbd> 일시정지</div>
      </section>
    </aside>

    <div class="mobile-controls" aria-label="터치 조작">
      <button type="button" data-action="left" aria-label="왼쪽 이동">←</button>
      <button type="button" data-action="rotate" aria-label="회전">↻</button>
      <button type="button" data-action="down" aria-label="아래 이동">↓</button>
      <button type="button" data-action="right" aria-label="오른쪽 이동">→</button>
      <button type="button" data-action="drop" aria-label="즉시 내리기">⤓</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const COLS = 10;
      const ROWS = 20;
      const SIZE = 30;
      const COLORS = {
        I: "#38bdf8", O: "#facc15", T: "#a78bfa", S: "#4ade80",
        Z: "#fb7185", J: "#60a5fa", L: "#fb923c"
      };
      const SHAPES = {
        I: [[1, 1, 1, 1]],
        O: [[1, 1], [1, 1]],
        T: [[0, 1, 0], [1, 1, 1]],
        S: [[0, 1, 1], [1, 1, 0]],
        Z: [[1, 1, 0], [0, 1, 1]],
        J: [[1, 0, 0], [1, 1, 1]],
        L: [[0, 0, 1], [1, 1, 1]]
      };

      const boardCanvas = document.querySelector("#board");
      const boardContext = boardCanvas.getContext("2d");
      const nextCanvas = document.querySelector("#next");
      const nextContext = nextCanvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayMessage = document.querySelector("#overlay-message");
      const scoreElement = document.querySelector("#score");
      const bestElement = document.querySelector("#best");
      const levelElement = document.querySelector("#level");
      const linesElement = document.querySelector("#lines");

      let board;
      let current;
      let queue;
      let bag;
      let score = 0;
      let lines = 0;
      let level = 1;
      let best = loadBest();
      let running = true;
      let paused = false;
      let gameOver = false;
      let lastTime = 0;
      let dropTimer = 0;

      function loadBest() {
        try {
          return Number(localStorage.getItem("tetris-best")) || 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("tetris-best", String(best));
        } catch (error) {
          bestElement.title = "이 브라우저에서는 최고 점수를 저장할 수 없습니다.";
        }
      }

      function emptyBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      }

      function refillBag() {
        bag = Object.keys(SHAPES);
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      }

      function takePiece() {
        if (bag.length === 0) refillBag();
        const type = bag.pop();
        const shape = SHAPES[type].map(row => row.slice());
        return {
          type,
          shape,
          x: Math.floor((COLS - shape[0].length) / 2),
          y: 0
        };
      }

      function ensureQueue() {
        while (queue.length < 4) queue.push(takePiece());
      }

      function spawnPiece() {
        ensureQueue();
        current = queue.shift();
        ensureQueue();
        drawNext();
        if (collides(current, 0, 0, current.shape)) endGame();
      }

      function startGame() {
        board = emptyBoard();
        queue = [];
        bag = [];
        score = 0;
        lines = 0;
        level = 1;
        dropTimer = 0;
        paused = false;
        gameOver = false;
        running = true;
        overlay.hidden = true;
        updateStats();
        spawnPiece();
        lastTime = performance.now();
        draw();
      }

      function collides(piece, dx, dy, shape) {
        for (let y = 0; y < shape.length; y++) {
          for (let x = 0; x < shape[y].length; x++) {
            if (!shape[y][x]) continue;
            const boardX = piece.x + x + dx;
            const boardY = piece.y + y + dy;
            if (boardX < 0 || boardX >= COLS || boardY >= ROWS) return true;
            if (boardY >= 0 && board[boardY][boardX]) return true;
          }
        }
        return false;
      }

      function rotateShape(shape) {
        return shape[0].map((_, x) => shape.map(row => row[x]).reverse());
      }

      function rotatePiece() {
        const rotated = rotateShape(current.shape);
        for (const offset of [0, -1, 1, -2, 2]) {
          if (!collides(current, offset, 0, rotated)) {
            current.x += offset;
            current.shape = rotated;
            draw();
            return;
          }
        }
      }

      function move(dx, dy) {
        if (!collides(current, dx, dy, current.shape)) {
          current.x += dx;
          current.y += dy;
          return true;
        }
        return false;
      }

      function lockPiece() {
        current.shape.forEach((row, y) => row.forEach((cell, x) => {
          if (!cell) return;
          const boardY = current.y + y;
          if (boardY >= 0) board[boardY][current.x + x] = current.type;
        }));

        clearLines();
        spawnPiece();
      }

      function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (board[y].every(Boolean)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            y++;
          }
        }
        if (cleared) {
          const points = [0, 100, 300, 500, 800][cleared] * level;
          score += points;
          lines += cleared;
          level = Math.floor(lines / 10) + 1;
          if (score > best) {
            best = score;
            saveBest();
          }
          updateStats();
        }
      }

      function hardDrop() {
        let distance = 0;
        while (move(0, 1)) distance++;
        score += distance * 2;
        if (score > best) {
          best = score;
          saveBest();
        }
        updateStats();
        lockPiece();
      }

      function endGame() {
        gameOver = true;
        running = false;
        overlayTitle.textContent = "게임 오버";
        overlayMessage.textContent = "새 게임 버튼 또는 Enter 키로 다시 시작하세요.";
        overlay.hidden = false;
      }

      function togglePause() {
        if (gameOver) return;
        paused = !paused;
        if (paused) {
          overlayTitle.textContent = "일시정지";
          overlayMessage.textContent = "계속하려면 P 키를 누르세요.";
          overlay.hidden = false;
        } else {
          overlay.hidden = true;
          lastTime = performance.now();
        }
      }

      function updateStats() {
        scoreElement.textContent = score.toLocaleString("ko-KR");
        bestElement.textContent = best.toLocaleString("ko-KR");
        levelElement.textContent = level;
        linesElement.textContent = lines;
      }

      function drawCell(context, x, y, color, size) {
        context.fillStyle = color;
        context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
        context.fillStyle = "#ffffff30";
        context.fillRect(x * size + 2, y * size + 2, size - 4, 3);
      }

      function draw() {
        boardContext.fillStyle = "#0b1220";
        boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

        boardContext.strokeStyle = "#ffffff0b";
        boardContext.lineWidth = 1;
        for (let x = 0; x <= COLS; x++) {
          boardContext.beginPath();
          boardContext.moveTo(x * SIZE + 0.5, 0);
          boardContext.lineTo(x * SIZE + 0.5, ROWS * SIZE);
          boardContext.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          boardContext.beginPath();
          boardContext.moveTo(0, y * SIZE + 0.5);
          boardContext.lineTo(COLS * SIZE, y * SIZE + 0.5);
          boardContext.stroke();
        }

        board.forEach((row, y) => row.forEach((type, x) => {
          if (type) drawCell(boardContext, x, y, COLORS[type], SIZE);
        }));

        if (current) {
          let ghostY = current.y;
          while (!collides(current, 0, ghostY - current.y + 1, current.shape)) ghostY++;
          current.shape.forEach((row, y) => row.forEach((cell, x) => {
            if (!cell) return;
            const gx = current.x + x;
            const gy = ghostY + y;
            boardContext.strokeStyle = `${COLORS[current.type]}99`;
            boardContext.lineWidth = 2;
            boardContext.strokeRect(gx * SIZE + 4, gy * SIZE + 4, SIZE - 8, SIZE - 8);
            drawCell(boardContext, current.x + x, current.y + y, COLORS[current.type], SIZE);
          }));
        }
      }

      function drawNext() {
        nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        nextContext.fillStyle = "#0b1220";
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        const piece = queue[0];
        if (!piece) return;
        const size = 22;
        const width = piece.shape[0].length * size;
        const height = piece.shape.length * size;
        const offsetX = (nextCanvas.width - width) / 2;
        const offsetY = (nextCanvas.height - height) / 2;
        piece.shape.forEach((row, y) => row.forEach((cell, x) => {
          if (!cell) return;
          nextContext.fillStyle = COLORS[piece.type];
          nextContext.fillRect(offsetX + x * size + 1, offsetY + y * size + 1, size - 2, size - 2);
          nextContext.fillStyle = "#ffffff30";
          nextContext.fillRect(offsetX + x * size + 2, offsetY + y * size + 2, size - 4, 3);
        }));
      }

      function frame(time) {
        const delta = Math.min(time - lastTime, 100);
        lastTime = time;
        if (running && !paused) {
          dropTimer += delta;
          const interval = Math.max(90, 850 - (level - 1) * 65);
          if (dropTimer >= interval) {
            dropTimer = 0;
            if (!move(0, 1)) lockPiece();
          }
          draw();
        }
        requestAnimationFrame(frame);
      }

      function performAction(action) {
        if (gameOver) return;
        if (paused) {
          if (action === "pause") togglePause();
          return;
        }
        if (!running) return;
        if (action === "left") move(-1, 0);
        if (action === "right") move(1, 0);
        if (action === "down") {
          if (move(0, 1)) {
            score++;
            if (score > best) {
              best = score;
              saveBest();
            }
            updateStats();
          } else {
            lockPiece();
          }
        }
        if (action === "rotate") rotatePiece();
        if (action === "drop") hardDrop();
        if (action === "pause") togglePause();
        draw();
      }

      document.addEventListener("keydown", event => {
        const actions = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowDown: "down",
          ArrowUp: "rotate",
          " ": "drop",
          p: "pause",
          P: "pause"
        };
        const action = actions[event.key];
        if (action) {
          event.preventDefault();
          performAction(action);
        } else if (event.key === "Enter" && gameOver) {
          startGame();
        }
      });

      document.querySelector("#start-button").addEventListener("click", startGame);
      document.querySelector("#pause-button").addEventListener("click", () => performAction("pause"));
      document.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => performAction(button.dataset.action));
      });

      bestElement.textContent = best.toLocaleString("ko-KR");
      startGame();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
